<!DOCTYPE html>
<title>I AM ONE</title>
<style>
    @import url("agregore://theme/style.css");

    svg {
        position: fixed;
        width: 100vw;
        height: 100vh;
        top: 0px;
        left: 0px;
    }

    @keyframes spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }


    @keyframes spin-back {
        from {
            transform: rotate(360deg);
        }

        to {
            transform: rotate(0deg);
        }
    }

    @keyframes pulse {

        0%,
        100% {
            transform: scale(0.5);
        }

        50% {
            transform: scale(1.5);
        }
    }

    @keyframes pulse-r {

        0%,
        100% {
            r: 32;
        }

        50% {
            r: 16;
        }
    }

    .dot {
        fill: white;
        animation: pulse-r 2s infinite;
    }

    .sclera {
        fill: white;
    }

    .tri {
        fill: var(--ag-color-purple);
    }

    .triparent {
        animation: spin 4.2s ease-in-out infinite;
    }

    .triparent .dot {
        animation-delay: -1s;
    }

    .stars {
        animation: spin-back 69s linear infinite;
    }

    .aboveus {
        fill: none;
        stroke: var(--ag-color-green);
        stroke-width: 6px;
        animation: pulse 2.1s infinite;
    }

    .a2 {
        animation-delay: -1.05s;
    }

    .a3 {
        animation-delay: -0.525s;
    }
</style>
<svg viewbox="0 0 666 666"></svg>
<script>
    const BLACK = '#111'
    const WHITE = '#FCFCFC'
    const PURPLE = `rgb(165, 24, 201)`
    const PINK = `#E62EA5`

    const OUTLINE_WIDTH = 10
    const OUTLINE_COLOR = BLACK

    const RADIUS = 300

    const SQUARE_SIZE = yAt(54) * RADIUS - OUTLINE_WIDTH * 2


    function main() {
        document.querySelector('svg').innerHTML = `
<g transform="rotate(-90, 333 333) translate(333, 333)">
<g class="stars">
    ${makeDots(16, 420 / 2)}
    ${makeDots(16, 420 * 0.8, 45 / 3)}
    ${makeDots(16, 420)}
    ${makeDots(16, 420 * 1.2, 45 / 4)}
    ${makeDots(16, 420 / 4)}
    ${makeDots(8, 420 / 4)}
</g>
<g class="triparent">
    <path class="tri" d="${anglesToPath([0, 120, 240], RADIUS)} Z" stroke-linecap="round" />
    <circle class="sclera" r="64"/>
    ${makeDots(8, 64)}
    ${makeDots(8, 64 + 32, 45 / 2)}
    ${makeDots(3, RADIUS - 64 - 32)}
</g>

    <path class="aboveus" d="${anglesToPath([0, 60, 120, 180, 240, 300], RADIUS)} Z" stroke-linecap="round" />
    <path class="aboveus a2" d="${anglesToPath([0, 60, 120, 180, 240, 300], RADIUS)} Z" stroke-linecap="round" />
    <path class="aboveus a3" d="${anglesToPath([0, 60, 120, 180, 240, 300], RADIUS)} Z" stroke-linecap="round" />
</g>
`
    }

    main()

    function makeDots(n, scale, offset = 0, kind = "dot") {
        return makeCorners(n, offset).map((theta) => {
            return `<circle class="${kind}" r="${SQUARE_SIZE / 12}" ${centerPoint(theta, scale)} />`
        }).join('\n')
    }

    function makeCorners(n, offset = 0) {
        const increment = 360 / n
        const corners = []
        for (let i = 0; i < n; i++) {
            corners.push(i * increment + offset)
        }

        return corners
    }

    function anglesToPath(angles, scale) {
        return angles.map((theta, index) => {
            const command = (index === 0) ? 'M' : 'L'
            return `${command} ${(xAt(theta) * scale).toFixed(2)} ${(yAt(theta) * scale).toFixed(2)}`
        }).join(' ')
    }

    function lineBetween(theta1, theta2, scale, className = "outline") {
        return `<line class="${className}" ${linePoint(theta1, scale, 1)} ${linePoint(theta2, scale, 2)} />`
    }

    function linePoint(theta, scale = 0, index = "") {
        return `x${index}="${xAt(theta) * scale}" y${index}="${yAt(theta) * scale}"`
    }

    function centerPoint(theta, scale = 0) {
        return `cx="${xAt(theta) * scale}" cy="${yAt(theta) * scale}"`

    }

    function xAt(theta) {
        return Math.cos(toRad(theta))
    }

    function yAt(theta) {
        return Math.sin(toRad(theta))
    }

    function toRad(theta) {
        return Math.PI / 180 * theta
    }

    function pointDistance(theta1, theta2, scale) {
        const x1 = xAt(theta1) * scale
        const y1 = yAt(theta1) * scale

        const x2 = xAt(theta2) * scale
        const y2 = yAt(theta2) * scale

        return distance(x1, y1, x2, y2)
    }

    function distance(x1, y1, x2, y2) {
        const x = Math.abs(x1 - x2)
        const y = Math.abs(y1 - y2)
        return Math.sqrt(x ** 2 + y ** 2)
    }
</script>
